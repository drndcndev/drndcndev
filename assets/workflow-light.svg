<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 438" width="520" height="438" fill="none" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Delivery lifecycle</title>
<desc id="d">Requirements, design, build, UAT, hypercare, monitor and root cause analysis, with a dashed loop from root cause back to build that repeats until the exception stops recurring.</desc>
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0.5 L7 4 L0 7.5 z" fill="#B45309"/></marker>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.tt{font-size:19px;font-weight:700;fill:#0B1220;letter-spacing:-0.01em}
.cp{font-size:14px;font-weight:400;fill:#51607A}
.lp{font-size:14px;font-weight:600;fill:#B45309}
</style>
</defs>
<path d="M30 34 L30 394" stroke="#2F4FE0" stroke-width="2" opacity=".45"/><path d="M230 394 H450 Q470 394 470 374 V174 Q470 154 450 154 H242" stroke="#B45309" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="30" cy="34" r="7.5" fill="#FFFFFF" stroke="#2F4FE0" stroke-width="2.5"/><text class="tt" x="62" y="34" dy=".35em">Requirements</text><text class="cp" x="62" y="56">From process owners</text><circle cx="30" cy="94" r="7.5" fill="#FFFFFF" stroke="#2F4FE0" stroke-width="2.5"/><text class="tt" x="62" y="94" dy=".35em">Design</text><text class="cp" x="62" y="116">Technical design and estimates</text><circle cx="30" cy="154" r="7.5" fill="#FFFFFF" stroke="#2F4FE0" stroke-width="2.5"/><text class="tt" x="62" y="154" dy=".35em">Build</text><text class="cp" x="62" y="176">UiPath, SAP, Excel, web</text><circle cx="30" cy="214" r="7.5" fill="#FFFFFF" stroke="#2F4FE0" stroke-width="2.5"/><text class="tt" x="62" y="214" dy=".35em">UAT</text><text class="cp" x="62" y="236">Checked against requirements</text><circle cx="30" cy="274" r="7.5" fill="#FFFFFF" stroke="#2F4FE0" stroke-width="2.5"/><text class="tt" x="62" y="274" dy=".35em">Hypercare</text><text class="cp" x="62" y="296">Support through go-live</text><circle cx="30" cy="334" r="7.5" fill="#FFFFFF" stroke="#2F4FE0" stroke-width="2.5"/><text class="tt" x="62" y="334" dy=".35em">Monitor</text><text class="cp" x="62" y="356">Failures assessed</text><circle cx="30" cy="394" r="7.5" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/><text class="tt" x="62" y="394" dy=".35em">Root cause</text><text class="cp" x="62" y="416">Recurring exceptions</text><text class="lp" x="454" y="236.0" text-anchor="end">Repeats until it</text><text class="lp" x="454" y="254.0" text-anchor="end">stops recurring</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
